<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Canım Anneme Sonsuz Sevgi Evreni 🌌❤️</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #0b001a;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none; touch-action: none;
        }
        
        #EvrenCanvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 1;
        }

        .Arayuz-Konteyner {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 2;
            display: flex; flex-direction: column;
            justify-content: space-between; align-items: center;
            padding: 30px 20px; pointer-events: none;
        }

        .Baslik-Karti {
            background: rgba(255, 182, 193, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px 30px; border-radius: 50px;
            text-align: center; pointer-events: auto;
            box-shadow: 0 10px 30px rgba(251, 111, 146, 0.2);
        }
        .Baslik-Karti h1 {
            margin: 0; color: #fff; font-size: 1.5rem;
            text-shadow: 0 0 10px #ff7096, 0 0 20px #ff477e;
        }

        .Merkez-Alan {
            display: flex; justify-content: center; align-items: center;
            flex-grow: 1; pointer-events: auto;
        }
        .Muhurlu-Kalp {
            font-size: 5rem; cursor: pointer; position: relative;
            animation: devNabiz 1.5s infinite alternate ease-in-out;
            transition: transform 0.3s;
            filter: drop-shadow(0 0 20px rgba(255, 71, 126, 0.8));
        }
        .Muhurlu-Kalp:hover { transform: scale(1.2); }
        .Muhurlu-Kalp::after {
            content: 'TIKLA'; position: absolute; bottom: -25px; left: 50%;
            transform: translateX(-50%); font-size: 0.9rem; color: #fff;
            font-weight: bold; opacity: 0.7; text-shadow: 0 0 5px #fff;
        }

        .Mektup-Karti {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 90%; max-width: 450px;
            background: rgba(15, 5, 30, 0.9);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 2px solid #ff7096;
            border-radius: 30px; padding: 35px;
            color: #fff; text-align: center; pointer-events: auto;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 5;
        }
        .Mektup-Karti.acik { transform: translate(-50%, -50%) scale(1); }
        .Mektup-Metni {
            font-size: 1.1rem; line-height: 1.7; margin-bottom: 25px;
            min-height: 120px; font-weight: 400; text-align: left;
            white-space: pre-line;
        }
        .Kapat-Buton {
            background: linear-gradient(135deg, #ff477e, #ff7096);
            border: none; color: white; padding: 12px 30px;
            border-radius: 20px; font-weight: bold; cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 126, 0.4);
        }

        .Alt-Panel {
            display: flex; gap: 10px; pointer-events: auto;
            flex-wrap: wrap; justify-content: center;
        }
        .Mod-Buton {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7); padding: 12px 20px;
            border-radius: 20px; cursor: pointer; font-size: 0.9rem;
            font-weight: bold; transition: all 0.3s;
        }
        .Mod-Buton.aktif, .Mod-Buton:hover {
            background: #ff477e; border-color: #ff477e; color: #fff;
            box-shadow: 0 0 15px #ff477e;
        }

        @keyframes devNabiz { from { transform: scale(1); } to { transform: scale(1.15); } }
    </style>
</head>
<body>

    <canvas id="EvrenCanvas"></canvas>

    <div class="Arayuz-Konteyner">
        <div class="Baslik-Karti">
            <h1>Sonsuz Sevgi Evreni 🌌❤️</h1>
        </div>

        <div class="Merkez-Alan">
            <div class="Muhurlu-Kalp" id="AnaKalp" onclick="MektupAc()">❤️</div>
        </div>

        <div class="Alt-Panel">
            <button class="Mod-Buton aktif" onclick="ModDegistir(0, this)">🌸 Sakin Gece</button>
            <button class="Mod-Buton" onclick="ModDegistir(1, this)">💥 Sevgi Patlaması</button>
            <button class="Mod-Buton" onclick="ModDegistir(2, this)">🌌 Sonsuz Yıldızlar</button>
        </div>
    </div>

    <div class="Mektup-Karti" id="Mektup">
        <div class="Mektup-Metni" id="YaziAlani"></div>
        <button class="Kapat-Buton" onclick="MektupKapat()">Evrene Geri Dön</button>
    </div>

<script>
    const canvas = document.getElementById('EvrenCanvas');
    const ctx = canvas.getContext('2d');
    const yaziAlani = document.getElementById('YaziAlani');
    const mektupKarti = document.getElementById('Mektup');
    const anaKalp = document.getElementById('AnaKalp');

    let genislik = canvas.width = window.innerWidth;
    let yukseklik = canvas.height = window.innerHeight;

    let parcaciklar = [];
    let toplamParcacik = 2500; 
    let aktifMod = 0; 
    let fare = { x: null, y: null, yaricap: 100 };

    window.addEventListener('resize', () => {
        genislik = canvas.width = window.innerWidth;
        yukseklik = canvas.height = window.innerHeight;
        EvrenOlustur();
    });

    function FareAyarla(e) {
        fare.x = e.clientX || (e.touches && e.touches.length > 0 && e.touches[0].clientX);
        fare.y = e.clientY || (e.touches && e.touches.length > 0 && e.touches[0].clientY);
    }
    window.addEventListener('mousemove', FareAyarla);
    window.addEventListener('touchmove', FareAyarla, {passive: true});
    window.addEventListener('touchend', () => { fare.x = null; fare.y = null; });
    window.addEventListener('mouseleave', () => { fare.x = null; fare.y = null; });

    class Parcacik {
        constructor() {
            this.reset();
        }
        reset() {
            this.x = Math.random() * genislik;
            this.y = Math.random() * yukseklik;
            this.z = Math.random() * genislik; 
            this.boyut = Math.random() * 12 + 8; // Emojiler için en ideal boyut ayarı
            
            const emojiler = ['❤️', '💖', '💝', '💗', '💕', '✨', '🌸', '🌟'];
            this.ikon = emojiler[Math.floor(Math.random() * emojiler.length)];
            
            this.hizX = (Math.random() * 0.8 - 0.4);
            this.hizY = (Math.random() * 0.8 - 0.4);
            this.aci = Math.random() * Math.PI * 2;
            this.dalgaHizi = Math.random() * 0.02 + 0.005;
        }
        guncelle() {
            if (aktifMod === 0) { 
                this.x += this.hizX + Math.sin(this.aci) * 0.3;
                this.y += this.hizY + Math.cos(this.aci) * 0.3;
                this.aci += this.dalgaHizi;
            } else if (aktifMod === 1) { 
                let dx = this.x - genislik / 2;
                let dy = this.y - yukseklik / 2;
                let mesafe = Math.sqrt(dx * dx + dy * dy) || 1;
                this.x += (dx / mesafe) * 4;
                this.y += (dy / mesafe) * 4;
                if (this.x < 0 || this.x > genislik || this.y < 0 || this.y > yukseklik) {
                    this.reset();
                    this.x = genislik / 2;
                    this.y = yukseklik / 2;
                }
            } else if (aktifMod === 2) { 
                this.z -= 4;
                if (this.z <= 0) {
                    this.reset();
                    this.z = genislik;
                }
            }

            if (fare.x != null && fare.y != null) {
                let fx = this.x - fare.x;
                let fy = this.y - fare.y;
                let fMesafe = Math.sqrt(fx * fx + fy * fy);
                if (fMesafe < fare.yaricap) {
                    let itmeKuvveti = (fare.yaricap - fMesafe) / fare.yaricap;
                    this.x += (fx / fMesafe) * itmeKuvveti * 6;
                    this.y += (fy / fMesafe) * itmeKuvveti * 6;
                }
            }

            if (aktifMod !== 1 && (this.x < 0 || this.x > genislik || this.y < 0 || this.y > yukseklik)) {
                this.reset();
            }
        }
        ciz() {
            let cizimX = this.x;
            let cizimY = this.y;
            let cizimBoyut = this.boyut;

            if (aktifMod === 2) {
                let k = 150 / this.z;
                cizimX = (this.x - genislik / 2) * k + genislik / 2;
                cizimY = (this.y - yukseklik / 2) * k + yukseklik / 2;
                cizimBoyut = this.boyut * k * 1.5;
                if(cizimBoyut > 40) cizimBoyut = 40;
                if(cizimX < -50 || cizimX > genislik + 50 || cizimY < -50 || cizimY > yukseklik + 50) return;
            }

            ctx.font = `${cizimBoyut}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(this.ikon, cizimX, cizimY);
        }
    }

    function EvrenOlustur() {
        parcaciklar = [];
        for (let i = 0; i < toplamParcacik; i++) {
            parcaciklar.push(new Parcacik());
        }
    }

    function ModDegistir(modNo, butonElement) {
        aktifMod = modNo;
        document.querySelectorAll('.Mod-Buton').forEach(b => b.classList.remove('aktif'));
        butonElement.classList.add('aktif');

        if(modNo === 1) {
            parcaciklar.forEach(p => { p.x = genislik/2; p.y = yukseklik/2; });
        }
    }

    function Animasyon() {
